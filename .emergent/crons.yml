crons:
  - name: generate-absensi
    description: "Membuat baris absensi harian (default Hadir) untuk semua siswa tiap pagi 06:00 WIB"
    cron: "0 6 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/generate-absensi"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
